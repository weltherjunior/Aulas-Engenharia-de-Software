<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Clínica de Pacientes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; color: #1a1a2e; }

    .topbar {
      background: #1a3a5c; color: white;
      padding: 14px 30px;
      display: flex; align-items: center; gap: 16px;
    }
    .topbar h1 { font-size: 18px; }
    .badge { background: #2e6ea6; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-family: monospace; }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; display: grid; gap: 24px; }

    .card { background: white; border-radius: 10px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .card h2 { color: #1a3a5c; font-size: 18px; border-bottom: 2px solid #d6e8f7; padding-bottom: 10px; margin-bottom: 18px; }

    #mensagem {
      padding: 12px 16px; border-radius: 6px; font-size: 14px;
      display: none; margin-bottom: 4px;
    }
    #mensagem.sucesso { background: #e8f5e9; border: 1px solid #388e3c; color: #1e6b3c; display: block; }
    #mensagem.erro    { background: #fae0e0; border: 1px solid #9b1c1c; color: #9b1c1c; display: block; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 13px; font-weight: bold; color: #1a3a5c; }
    .form-group input { padding: 9px 12px; border: 1px solid #bdbdbd; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #2e6ea6; }
    .form-full { grid-column: 1 / -1; }

    .btn { padding: 9px 20px; border-radius: 6px; font-size: 13px; font-weight: bold; border: none; cursor: pointer; transition: opacity .2s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #1a3a5c; color: white; }
    .btn-success { background: #1e6b3c; color: white; }
    .btn-danger  { background: #9b1c1c; color: white; }
    .btn-sm      { padding: 5px 12px; font-size: 12px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #1a3a5c; color: white; padding: 10px 12px; text-align: left; }
    td { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; vertical-align: middle; }
    tr:hover td { background: #f5f9ff; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #d6e8f7; color: #1a3a5c; }
    .empty { text-align: center; color: #888; padding: 30px 0; }
    .loading { text-align: center; color: #888; padding: 20px; font-style: italic; }

    .topo-lista { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .topo-lista h2 { border: none; padding: 0; margin: 0; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>🏥 Clínica — Painel de Pacientes</h1>
  <span class="badge">API REST + AJAX</span>
</div>

<div class="container">

  <!-- FEEDBACK -->
  <div id="mensagem"></div>

  <!-- FORMULÁRIO -->
  <div class="card">
    <h2>Cadastrar Novo Paciente</h2>
    <form id="form-cadastro">
      <div class="form-grid">
        <div class="form-group">
          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" placeholder="Ex: João da Silva" required>
        </div>
        <div class="form-group">
          <label for="cpf">CPF *</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" required>
        </div>
        <div class="form-group">
          <label for="data_nascimento">Data de Nascimento *</label>
          <input type="date" id="data_nascimento" required>
        </div>
        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="(00) 00000-0000">
        </div>
        <div class="form-group form-full">
          <label for="convenio">Convênio</label>
          <input type="text" id="convenio" placeholder="Ex: Unimed, SulAmérica...">
        </div>
        <div class="form-full">
          <button type="submit" class="btn btn-success">Cadastrar Paciente</button>
        </div>
      </div>
    </form>
  </div>

  <!-- TABELA -->
  <div class="card">
    <div class="topo-lista">
      <h2>Lista de Pacientes</h2>
      <button class="btn btn-primary btn-sm" onclick="carregarPacientes()">↻ Atualizar</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nome</th><th>CPF</th>
          <th>Nascimento</th><th>Telefone</th><th>Convênio</th><th>Ação</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <tr><td colspan="7" class="loading">Carregando...</td></tr>
      </tbody>
    </table>
    <p id="total-info" style="margin-top:12px;font-size:13px;color:#888;"></p>
  </div>

</div>

<script>
  const API_URL = "api/pacientes.php";

  // ── Feedback ─────────────────────────────────────────────────
  function exibirMensagem(texto, tipo = "sucesso") {
    const el = document.getElementById("mensagem");
    el.textContent = texto;
    el.className = tipo;
    setTimeout(() => { el.className = ""; el.textContent = ""; }, 4000);
  }

  // ── GET — Listar todos os pacientes ──────────────────────────
  function carregarPacientes() {
    document.getElementById("corpo-tabela").innerHTML =
      '<tr><td colspan="7" class="loading">Carregando...</td></tr>';
    setTimeout(() => {}, 5000); // Simula um pequeno atraso para exibir o carregando 
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("corpo-tabela");

        if (data.status !== "success" || data.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty">Nenhum paciente cadastrado.</td></tr>';
          document.getElementById("total-info").textContent = "";
          return;
        }

        // Monta as linhas da tabela dinamicamente
        tbody.innerHTML = data.data.map(pac => `
          <tr>
            <td>${pac.id}</td>
            <td><strong>${pac.nome}</strong></td>
            <td>${pac.cpf}</td>
            <td>${formatarData(pac.data_nascimento)}</td>
            <td>${pac.telefone ?? "—"}</td>
            <td>${pac.convenio ? `<span class="tag">${pac.convenio}</span>` : "—"}</td>
            <td>
              <button class="btn btn-danger btn-sm"
                      onclick="excluirPaciente(${pac.id}, '${pac.nome}')">
                Excluir
              </button>
            </td>
          </tr>
        `).join("");

        document.getElementById("total-info").textContent =
          `Total: ${data.total} paciente(s) cadastrado(s).`;
      })
      .catch(() => exibirMensagem("Erro de conexão com a API.", "erro"));
  }

  // ── POST — Cadastrar paciente ─────────────────────────────────
  function cadastrarPaciente(event) {
    event.preventDefault();

    const dados = {
      nome:            document.getElementById("nome").value.trim(),
      cpf:             document.getElementById("cpf").value.trim(),
      data_nascimento: document.getElementById("data_nascimento").value,
      telefone:        document.getElementById("telefone").value.trim() || null,
      convenio:        document.getElementById("convenio").value.trim()  || null,
    };

    fetch(API_URL, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify(dados)
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        exibirMensagem(`Paciente cadastrado com sucesso! ID: ${data.id}`, "sucesso");
        document.getElementById("form-cadastro").reset();
        carregarPacientes();
      } else {
        const campos = data.campos ? ` (${data.campos.join(", ")})` : "";
        exibirMensagem(`Erro: ${data.message}${campos}`, "erro");
      }
    })
    .catch(() => exibirMensagem("Erro de conexão com a API.", "erro"));
  }

  // ── DELETE — Excluir paciente ─────────────────────────────────
  function excluirPaciente(id, nome) {
    if (!confirm(`Deseja realmente excluir o paciente "${nome}"?`)) return;

    fetch(`${API_URL}?id=${id}`, { method: "DELETE" })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          exibirMensagem("Paciente excluído com sucesso!", "sucesso");
          carregarPacientes();
        } else {
          exibirMensagem(`Erro: ${data.message}`, "erro");
        }
      })
      .catch(() => exibirMensagem("Erro de conexão com a API.", "erro"));
  }

  // ── Helper: formatar data YYYY-MM-DD → DD/MM/YYYY ────────────
  function formatarData(data) {
    if (!data) return "—";
    const [ano, mes, dia] = data.split("-");
    return `${dia}/${mes}/${ano}`;
  }

  // ── Eventos ───────────────────────────────────────────────────
  document.getElementById("form-cadastro")
          .addEventListener("submit", cadastrarPaciente);

  // Carrega os pacientes ao abrir a página
  carregarPacientes();
</script>
</body>
</html>
